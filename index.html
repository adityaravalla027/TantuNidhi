<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeaveAhead | Massive Enterprise Artisan & Supply Engine</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --surface: #131b2e;
            --surface-card: #18223a;
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 153, 0, 0.3);
            --brand-orange: #ff9900;
            --brand-hover: #e88b00;
            --emerald: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glow: 0 0 25px rgba(255, 153, 0, 0.15);
            --transition-fluid: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- MASSIVE HEADER & NAVBAR --- */
        header { background: rgba(9, 13, 22, 0.95); border-bottom: 1px solid var(--border); padding: 1rem 2.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(12px); }
        .brand { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .brand span { color: var(--brand-orange); }

        .search-container { display: flex; flex-grow: 1; max-width: 650px; margin: 0 2rem; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
        .search-container select { background: transparent; border: none; padding: 0 12px; font-size: 0.85rem; border-right: 1px solid var(--border); cursor: pointer; color: var(--text-sub); outline: none; }
        .search-container input { flex-grow: 1; padding: 0.65rem 1rem; border: none; outline: none; background: transparent; color: #fff; font-size: 0.95rem; }
        .search-container button { background: var(--brand-orange); border: none; padding: 0 1.25rem; cursor: pointer; font-weight: bold; color: #000; transition: background 0.2s; }
        .search-container button:hover { background: var(--brand-hover); }

        .nav-actions { display: flex; gap: 1rem; align-items: center; }
        .nav-btn { background: transparent; color: var(--text-sub); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
        .nav-btn:hover, .nav-btn.active { color: #fff; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); }

        /* --- CONTAINER & TABS --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 2.5rem 2rem; width: 100%; flex-grow: 1; }
        .tab-view { 
            display: none; 
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s var(--transition-fluid);
        }
        .tab-view.active { 
            display: block; 
            opacity: 1;
            transform: translateY(0);
        }

        /* --- CATALOG GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: var(--border-glow); box-shadow: var(--glow); }
        
        .cluster-badge { display: inline-block; padding: 0.25rem 0.6rem; font-size: 0.7rem; background: rgba(255,153,0,0.1); color: var(--brand-orange); border-radius: 4px; margin-bottom: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .primary-btn { background: var(--brand-orange); border: none; border-radius: 8px; padding: 0.65rem 1rem; cursor: pointer; font-weight: 600; width: 100%; color: #000; transition: background 0.2s; }
        .primary-btn:hover { background: var(--brand-hover); }

        /* --- CHECKOUT & PANELS --- */
        .checkout-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        @media(max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; } }
        
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.75rem; }
        input, textarea { width: 100%; padding: 0.7rem; background: var(--bg-deep); border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-top: 0.3rem; margin-bottom: 1rem; outline: none; font-size: 0.9rem; }
        input:focus, textarea:focus { border-color: var(--brand-orange); box-shadow: 0 0 5px rgba(255,153,0,0.3); }
        
        pre { background: #05070a; color: var(--brand-orange); padding: 1rem; border-radius: 8px; font-family: monospace; overflow-x: auto; border: 1px solid var(--border); margin-top: 1rem; }
    </style>
</head>
<body>

    <header>
        <a class="brand" onclick="switchTab('store', document.querySelectorAll('.nav-btn')[0])">Weave<span>Ahead</span> Engine</a>
        
        <div class="search-container">
            <select id="search-cluster-filter">
                <option value="">All Clusters</option>
                <option value="Handlooms">Handlooms</option>
                <option value="Apparel">Apparel</option>
                <option value="Logistics">Logistics</option>
            </select>
            <input type="text" id="search-query" placeholder="Search craft catalogs, SKUs, or cluster nodes..." oninput="debouncedFetchProducts()">
            <button onclick="fetchProducts()">🔍</button>
        </div>

        <div class="nav-actions">
            <button class="nav-btn active" onclick="switchTab('store', this)">Catalog</button>
            <button class="nav-btn" onclick="switchTab('cart', this)">🛒 Cart (<span id="cart-count">0</span>)</button>
            <button class="nav-btn" onclick="switchTab('studio', this)">🔊 Neural Studio</button>
        </div>
    </header>

    <div class="container">

        <!-- TAB 1: CATALOG STOREFRONT -->
        <div id="tab-store" class="tab-view active">
            <div id="product-grid" class="grid"></div>
        </div>

        <!-- TAB 2: CART & SECURE CHECKOUT -->
        <div id="tab-cart" class="tab-view">
            <h2 style="margin-bottom: 1.5rem; font-weight: 700;">Cooperative Order Fulfillment</h2>
            <div class="checkout-layout">
                <div class="panel">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Active Cart Manifest</h3>
                    <div id="cart-items-container"></div>
                </div>
                <div class="panel" id="checkout-panel" style="display:none; height:fit-content;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Transaction Summary</h3>
                    <div id="cart-summary-text" style="margin-bottom: 1rem; font-size: 0.95rem; color:var(--text-sub);"></div>
                    <hr style="border:0; border-top:1px solid var(--border); margin-bottom: 1rem;">
                    <label style="font-size:0.8rem; color:var(--text-sub);">Cluster Delivery Hub</label>
                    <input type="text" id="ship-addr" value="Sector 4 Distribution Node">
                    <div style="display:flex; gap:0.5rem;">
                        <div style="flex:1;"><label style="font-size:0.8rem; color:var(--text-sub);">City</label><input type="text" id="ship-city" value="Bhubaneswar"></div>
                        <div style="flex:1;"><label style="font-size:0.8rem; color:var(--text-sub);">Postal Code</label><input type="text" id="ship-postal" value="751024"></div>
                    </div>
                    <button class="primary-btn" onclick="executeCheckout()" style="margin-top:0.5rem;">Commit Transaction Lock</button>
                </div>
            </div>
        </div>

        <!-- TAB 3: NEURAL SSML AUDIO STUDIO -->
        <div id="tab-studio" class="tab-view">
            <div class="panel" style="max-width:800px; margin:0 auto;">
                <h2 style="margin-bottom: 0.5rem; font-weight: 700;">Neural SSML Audio Synthesis Studio</h2>
                <p style="color:var(--text-sub); font-size:0.9rem; margin-bottom:1.5rem;">Simulate automated voice notification payloads and stream broadcasts for regional craft cooperatives.</p>
                <label style="font-size:0.8rem; color:var(--text-sub);">Payload Text Content</label>
                <textarea id="ssml-text" rows="4">Attention cooperative hubs! High-priority supply route successfully optimized through sector 4.</textarea>
                <button class="primary-btn" onclick="compileSSML()" style="width:auto; padding: 0.7rem 1.5rem;">Compile Neural Stream</button>
                <pre id="studio-output">Awaiting compilation request...</pre>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000"; // Connects directly to your local FastAPI backend
        let localCart = [];
        let searchDebounceTimer = null;

        window.onload = () => {
            fetchProducts();
        };

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            const target = document.getElementById('tab-' + tabName);
            target.classList.add('active');
            if(btnElement) btnElement.classList.add('active');
            
            if(tabName === 'cart') renderCart();
        }

        function debouncedFetchProducts() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(fetchProducts, 250);
        }

        async function fetchProducts() {
            try {
                const query = document.getElementById('search-query').value;
                const res = await fetch(`${API_BASE}/api/v1/products?search=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                const grid = document.getElementById('product-grid');
                grid.innerHTML = data.products.map(p => `
                    <div class="card">
                        <div>
                            <span class="cluster-badge">${p.cluster} Cluster</span>
                            <h3 style="font-size: 1.1rem; margin-bottom: 0.4rem; color: #fff;">${p.title}</h3>
                            <p style="color: var(--text-sub); font-size: 0.8rem; margin-bottom: 1rem;">SKU: ${p.sku} | Stock: ${p.stock}</p>
                            <div style="font-size: 1.25rem; font-weight: 700; color: var(--brand-orange);">₹${p.price.toLocaleString('en-IN')}</div>
                        </div>
                        <button class="primary-btn" onclick='addItemToCart(${JSON.stringify(p)})' style="margin-top: 1rem;">Add to Cart Session</button>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('product-grid').innerHTML = '<p style="color:#ef4444; grid-column:1/-1;">Could not reach backend server. Make sure your FastAPI backend is running!</p>';
            }
        }

        function addItemToCart(product) {
            const existing = localCart.find(i => i.id === product.id);
            if(existing) {
                existing.quantity += 1;
            } else {
                localCart.push({ ...product, quantity: 1 });
            }
            document.getElementById('cart-count').innerText = localCart.reduce((acc, i) => acc + i.quantity, 0);
            alert(`Added "${product.title}" to session manifest.`);
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const checkoutPanel = document.getElementById('checkout-panel');
            const summaryText = document.getElementById('cart-summary-text');
            
            if(localCart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-sub);">Your cart manifest is currently empty. <a href="#" onclick="switchTab(\'store\', document.querySelectorAll(\'.nav-btn\')[0])" style="color:var(--brand-orange);">Browse catalog items</a></p>';
                checkoutPanel.style.display = 'none';
                return;
            }

            checkoutPanel.style.display = 'block';

            container.innerHTML = localCart.map(i => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 1rem 0; border-bottom: 1px solid var(--border);">
                    <div>
                        <h4 style="font-size:1rem; color:#fff; margin-bottom:0.2rem;">${i.title}</h4>
                        <span style="font-size:0.85rem; color:var(--text-sub);">Quantity: ${i.quantity} | Unit Price: ₹${i.price.toLocaleString('en-IN')}</span>
                    </div>
                    <div style="font-weight:bold; color:var(--brand-orange);">₹${(i.price * i.quantity).toLocaleString('en-IN')}</div>
                </div>
            `).join('');

            const subtotal = localCart.reduce((acc, i) => acc + (i.price * i.quantity), 0);
            const gst = subtotal * 0.18;
            const grandTotal = subtotal + gst;

            summaryText.innerHTML = `
                Subtotal (${localCart.reduce((acc, i) => acc + i.quantity, 0)} items): ₹${subtotal.toLocaleString('en-IN')}<br>
                Estimated GST (18%): ₹${gst.toFixed(2)}<br>
                <div style="margin-top: 0.5rem; font-size: 1.1rem; color:#fff;">Grand Total: <b style="color:var(--brand-orange);">₹${grandTotal.toFixed(2)}</b></div>
            `;
        }

        function executeCheckout() {
            if(localCart.length === 0) return;
            alert('Transaction Lock Committed Successfully! Order placed.');
            localCart = [];
            document.getElementById('cart-count').innerText = '0';
            switchTab('store', document.querySelectorAll('.nav-btn')[0]);
        }

        async function compileSSML() {
            const textVal = document.getElementById('ssml-text').value;
            try {
                const res = await fetch(`${API_BASE}/api/v1/voice/synthesize-ssml`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textVal })
                });
                const data = await res.json();
                document.getElementById('studio-output').innerText = data.compiled_ssml || JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('studio-output').innerText = "Error connecting to neural synthesis backend endpoint.";
            }
        }
    </script>
</body>
</html>
</html>

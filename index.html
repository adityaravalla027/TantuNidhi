<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeaveAhead — National Handloom Intelligence Platform</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #f8fafc;
            --accent-glow: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #171c30 50%, #291535 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .liquid-container {
            position: relative;
            width: 100%;
            max-width: 680px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }

        .liquid-container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 160px;
            height: 160px;
            background: rgba(14, 165, 233, 0.3);
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        select option {
            background: #1e1b4b;
            color: #fff;
        }

        select:focus, input:focus {
            border-color: var(--accent-glow);
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: none;
        }

        .result-box h3 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .result-item {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="liquid-container">
        <header>
            <h1>WeaveAhead Portal</h1>
            <p>AI-Powered Demand Forecasting & Government Scheme Integration</p>
        </header>

        <div class="form-group">
            <label for="clusterRegion">Select Weaver Region / Cluster</label>
            <select id="clusterRegion">
                <option value="Varanasi">Uttar Pradesh — Banarasi Brocade</option>
                <option value="WestBengal">West Bengal — Jamdani & Baluchari</option>
                <option value="Odisha">Odisha — Sambalpuri Ikat & Bomkai</option>
                <option value="TamilNadu">Tamil Nadu — Kanjeevaram Silk</option>
                <option value="Telangana">Telangana — Pochampally Ikat</option>
                <option value="Gujarat">Gujarat — Patola & Bandhani</option>
            </select>
        </div>

        <div class="form-group">
            <label for="languageCode">Regional Language (12 Scheduled Languages)</label>
            <select id="languageCode">
                <option value="hi">Hindi (हिंदी)</option>
                <option value="bn">Bengali (বাংলা)</option>
                <option value="or">Odia (ଓଡ଼ିଆ)</option>
                <option value="ta">Tamil (தமிழ்)</option>
                <option value="te">Telugu (తెలుగు)</option>
                <option value="gu">Gujarati (ગુજરાતી)</option>
                <option value="mr">Marathi (मराठी)</option>
                <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
                <option value="as">Assamese (অসমীয়া)</option>
                <option value="kn">Kannada (ಕನ್ನಡ)</option>
                <option value="ml">Malayalam (മലയാളം)</option>
                <option value="ur">Urdu (اردو)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmount">MUDRA Loan Application Amount (₹)</label>
            <input type="number" id="loanAmount" value="150000" placeholder="Enter amount in INR">
        </div>

        <div class="action-row">
            <button onclick="fetchForecast()">📊 Get Weekly Forecast</button>
            <button onclick="fetchGovtCredit()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);">🏛️ Check MUDRA Subsidy</button>
        </div>

        <div id="resultOutput" class="result-box">
            <h3 id="resultTitle">Output Data</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";

        async function fetchForecast() {
            const region = document.getElementById('clusterRegion').value;
            const lang = document.getElementById('languageCode').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/forecast/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cluster_region: region, language_code: lang, craft_type: "Traditional Handloom" })
                });
                const result = await response.json();
                
                if(result.status === "success") {
                    const data = result.data;
                    document.getElementById('resultTitle').innerText = "📈 Weekly AI Demand Forecast";
                    document.getElementById('resultContent').innerHTML = `
                        <div class="result-item"><strong>Region:</strong> ${data.region}</div>
                        <div class="result-item"><strong>Language Profile:</strong> ${data.language.toUpperCase()}</div>
                        <div class="result-item"><strong>Trending Products:</strong> ${data.trending_products.join(', ')}</div>
                        <div class="result-item"><strong>Color Alert:</strong> ${data.color_palette_alert}</div>
                        <div class="result-item"><strong>Advisory:</strong> ${data.raw_material_advisory}</div>
                    `;
                    document.getElementById('resultOutput').style.display = "block";
                }
            } catch (err) {
                alert("Could not connect to FastAPI backend. Ensure main.py is running locally on port 8000.");
            }
        }

        async function fetchGovtCredit() {
            const amount = parseFloat(document.getElementById('loanAmount').value);

            try {
                const response = await fetch(`${API_BASE}/api/v1/govt/credit-integration`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ applicant_id: "WVR-9921", applicant_type: "individual", loan_amount: amount, forecasted_stability_score: 8.9 })
                });
                const result = await response.json();
                
                if(result.status === "success") {
                    const data = result.data;
                    document.getElementById('resultTitle').innerText = "🏛️ Weavers MUDRA Scheme (WMS) Status";
                    document.getElementById('resultContent').innerHTML = `
                        <div class="result-item"><strong>Scheme:</strong> ${data.Scheme}</div>
                        <div class="result-item"><strong>Loan Tier:</strong> ${data["Loan Tier"]}</div>
                        <div class="result-item"><strong>Margin Money Grant:</strong> ${data["Calculated Margin Money Assistance"]}</div>
                        <div class="result-item"><strong>Interest Subvention:</strong> ${data["Interest Subvention"]}</div>
                        <div class="result-item"><strong>Status:</strong> ${data["Credit Status"]}</div>
                    `;
                    document.getElementById('resultOutput').style.display = "block";
                }
            } catch (err) {
                alert("Could not connect to FastAPI backend. Ensure main.py is running locally on port 8000.");
            }
        }
    </script>
</body>
</html>
